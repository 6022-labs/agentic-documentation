# nginx ships no .md or .vtt MIME mapping, so llms.txt page mirrors and video captions
# would go out as application/octet-stream (browsers ignore captions without text/vtt).
# A second types block at http level merges into the included mime.types map.
types {
    text/markdown md;
    text/vtt vtt;
}

# Docs contain em dashes and curly quotes; without this, text/* has no charset
# and clients may decode UTF-8 as ISO-8859-1.
charset utf-8;
charset_types text/markdown text/vtt text/plain text/html text/css application/javascript;
