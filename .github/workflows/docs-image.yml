name: Docs Image

on:
  pull_request:
    branches:
      - main
    paths:
      - "Dockerfile"
      - ".dockerignore"
      - "nginx-markdown.conf"
      - ".github/workflows/docs-image.yml"

concurrency:
  group: docs-image-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Build
        run: docker build --build-arg DOCS_URL=https://docs.agentic.6022.io --tag docs .

      - name: Check nginx config
        run: docker run --rm docs nginx -t
